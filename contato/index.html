<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contato</title>
</head>
<body>
        <nav class="nav">
        <ul class="menusPages">
            <li><a class="linksPage" href="index.html">Home</a></li>
            <li><a class="linksPage" href="index.html">Sobre</a></li>
            <li><a class="linksPage" href="index.html">Contato</a></li>
        </ul>
    </nav>

    <main>
        <h1>Contato</h1>
        <p>Entre em contato conosco preenchendo o formulário abaixo:</p>
        <form id="contato">
            <div class="field">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field">
                <p>Gênero:</p>
                <div class="options">
                    <label class="op-labels"><input type="radio" name="genero" value="Feminino"required> Feminino</label>
                    <label class="op-labels"><input type="radio" name="genero" value="Masculino" > Masculino</label>
                    <label class="op-labels"><input type="radio" name="genero" value="Outro"> Outro</label>
                </div>
            </div>

            <div class="field">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>

            <div class="field">
                <p>Assunto:</p>
                <div class="options">
                    <label class="op-labels"><input type="radio" name="assunto" value="Dúvida" required> Dúvida</label>
                    <label class="op-labels"><input type="radio" name="assunto" value="Sugestão"> Sugestão</label>
                    <label class="op-labels"><input type="radio" name="assunto" value="Reclamação"> Reclamação</label>
                    <label class="op-labels"><input type="radio" name="assunto" value="Outro"> Outro</label>
                </div>
            </div>

            <div class="field">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" required></textarea>
            </div>

            <button type="submit">Enviar</button>
        </form>
    </main>
    <script src="script.js"></script>
</body>
</html>
