<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Temporizador</title>
</head>
<body>
    <nav>       
        <div class="taça">
            <img src="https://upload.wikimedia.org/wikipedia/pt/thumb/d/d7/Logo_copa_2026.png/250px-Logo_copa_2026.png" alt="">
        </div>
    </nav>
    <div class="image">
            <img src="https://i.pinimg.com/564x/2d/6c/53/2d6c532ddc03d0d8743fbd7436431964.jpg" alt="">
        </div> 
   
 <div class="timer-block">
   <div class="container">
    <h1>Caminho do Hexa</h1>
    <p>Abertura: 11 de junho de 2026 — MetLife Stadium, Nova York</p>
    <p>Término: 18 de julho de 2026 — MetLife Stadium, Nova York</p>
    <h2>Faltam:</h2>

    <div class="units">
      <div class="unit"><div class="unit-num" id="days">--</div><div class="unit-label">Dias</div></div>
      <div class="unit"><div class="unit-num" id="hours">--</div><div class="unit-label">Horas</div></div>
      <div class="unit"><div class="unit-num" id="minutes">--</div><div class="unit-label">Minutos</div></div>
      <div class="unit"><div class="unit-num" id="seconds">--</div><div class="unit-label">Segundos</div></div>
    </div>
  </div>
</div>

<footer>
    <div class="footer-left">
      <p>Copa do mundo FIFA 2026 &nbsp;·&nbsp; <strong>EUA · Canadá · México</strong></p>
    </div>
    <div class="footer-right">
     <p>Dados baseados no site oficial da FIFA</p>
    </div>
  </footer>



</body>
 
<script src="script.js"></script>
</html>
